<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>John Blackmore</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: #f5f3f0;
            color: #2d3436;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            line-height: 1.6;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #2d3436;
        }
        
        .tagline {
            font-size: 1.125rem;
            color: #636e72;
            margin-bottom: 0.5rem;
            font-weight: 400;
        }
        
        .interests {
            margin-bottom: 2.5rem;
            font-size: 0.95rem;
            color: #5f8a8b;
        }
        
        .interests span {
            display: inline-block;
            margin-right: 0.5rem;
        }
        
        .links {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        
        .tagline a,
        .links a {
            color: #2d3436;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s ease;
            position: relative;
        }
        
        .tagline a:after,
        .links a:after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -2px;
            left: 0;
            background-color: #5f8a8b;
            transition: width 0.6s ease;
        }
        
        .tagline a:hover,
        .links a:hover {
            color: #5f8a8b;
        }
        
        .tagline a:hover:after,
        .links a:hover:after {
            width: 100%;
        }
        
        @media (max-width: 640px) {
            h1 {
                font-size: 2rem;
            }
            
            .tagline {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>John Blackmore</h1>
        <p class="tagline">
            Software engineer with 20+ years experience building scalable web applications in FinTech, PropTech and Insurance.
        </p>
        
        <div class="interests">
            <span>AI coding</span>
            <span>•</span>
            <span>Open banking</span>
            <span>•</span>
            <span>PHP architecture</span>
        </div>
        
        <div class="links">
            <a href="about">CV</a>
            <a href="https://github.com/johnblackmore" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="https://linkedin.com/in/johnblackmore" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            <a href="https://instagram.com/johnblackmore" target="_blank" rel="noopener noreferrer">Instagram</a>
        </div>
    </div>
</body>
</html>
